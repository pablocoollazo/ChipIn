spring.application.name=EnServ
spring.datasource.url=jdbc:postgresql://localhost:5432/chipin
spring.datasource.username=chipin
spring.datasource.password=chipin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/usuarios.sql,classpath:sql/grupos.sql
chipin.jwt.access-ttl=PT15M
chipin.jwt.refresh-ttl=P7D